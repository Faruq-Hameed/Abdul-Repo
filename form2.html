<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML form continuation</title>
</head>

<body>

        <label for="food">Select your best food</label> &nbsp;  &nbsp; &nbsp; <label for="food">Select your best food</label>

            <option value="beans">Beans</option>
            <option value="bread">Bread</option>
            
            <optgroup label="Vegetables">Vegetables</optgroup>
            <option> Tomato</option>
            <option> Tomato</option>
            <option> Tomato</option>
            <option> Tomato</option>
        </select>

        <fieldset>
            <legend>User details</legend>
            <textarea name="" id="" cols="30" rows="10">Default text</textarea>
        </fieldset>
    </form>
</body>

</html>
